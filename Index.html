<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vishnu's Landscape</title>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #071B45;
    --paper-raised: #EAF2FC;
    --paper-recessed: #D9E6F8;
    --ink: #0B2A5B;
    --ink-faint: #6683AD;
    --canvas-ink: #EAF2FC;
    --canvas-ink-faint: rgba(234, 242, 252, 0.6);
    --thread: #0B2A5B;
    --thread-light: rgba(11, 42, 91, 0.3);
    --amber: #B8722E;
    --amber-soft: rgba(184, 114, 46, 0.16);
    --line: rgba(11, 42, 91, 0.14);
    --tag: #B8722E;
    --canvas-line: rgba(234, 242, 252, 0.28);
    --done: #2FA36B;
    --danger: #B0554A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--canvas-ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0 0 80px 0;
  }

  .topbar {
    background: var(--paper-raised);
    border-bottom: 1px solid var(--line);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-mark {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--thread);
    letter-spacing: -0.02em;
  }
  .brand-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .sync-chip {
    display: flex; align-items: center; gap: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .sync-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--done);
    transition: background 0.2s ease;
  }
  .sync-dot.syncing { background: var(--amber); }

  .page-header {
    max-width: 1200px;
    margin: 0 auto;
    padding: 44px 32px 8px;
  }
  .breadcrumb {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--canvas-ink-faint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .page-title {
    font-family: 'Fraunces', serif;
    font-size: 40px;
    font-weight: 500;
    color: var(--canvas-ink);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .page-meta {
    color: var(--canvas-ink-faint);
    font-size: 14px;
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .meta-dot { color: var(--amber); }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 32px;
  }

  .thread {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(31,41,55,0.04);
  }

  .thread-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
  }
  .thread.open .thread-header { border-bottom: 1px solid var(--line); }

  .thread-title {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--ink);
    display: block;
  }
  .thread-progress { display: flex; align-items: center; gap: 8px; }
  .progress-track {
    width: 60px; height: 5px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--done); border-radius: 3px; }
  .progress-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .chevron {
    color: var(--ink-faint);
    font-size: 12px;
    transition: transform 0.2s ease;
    width: 14px;
  }
  .thread.open .chevron { transform: rotate(90deg); }

  .icon-btn {
    color: var(--ink-faint);
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 5px;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--danger); background: var(--paper-recessed); }

  .thread-body { display: none; }
  .thread.open .thread-body { display: block; }

  .subthread-row {
    display: flex;
    align-items: flex-start;
    gap: 0;
    padding: 20px 22px 22px 22px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .subthread-row::-webkit-scrollbar { height: 8px; }
  .subthread-row::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .subthread-connector {
    width: 28px;
    height: 2px;
    background: repeating-linear-gradient(
      to right,
      var(--thread-light) 0px, var(--thread-light) 4px,
      transparent 4px, transparent 8px
    );
    margin-top: 20px;
    flex-shrink: 0;
  }

  .subthread {
    background: var(--paper-recessed);
    border: 1px solid var(--line);
    border-radius: 12px;
    width: 260px;
    flex-shrink: 0;
    overflow: hidden;
  }

  .subthread-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
    background: var(--paper-raised);
  }
  .subthread-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--thread);
    flex-shrink: 0;
  }
  .subthread-titlewrap { flex: 1; min-width: 0; }
  .subthread-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .subthread-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--tag);
    letter-spacing: 0.02em;
    margin-top: 2px;
    display: block;
  }
  .subthread-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    margin-top: 2px;
    display: block;
  }
  .subthread-chevron {
    color: var(--ink-faint);
    font-size: 11px;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .subthread.open .subthread-chevron { transform: rotate(90deg); }

  .subthread-content { display: none; padding: 10px 14px 14px; }
  .subthread.open .subthread-content { display: block; }

  .action-list { display: flex; flex-direction: column; gap: 4px; }
  .action-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 7px;
    transition: background 0.12s ease;
  }
  .action-item:hover { background: var(--paper-raised); }
  .action-item:hover .icon-btn.delete-item { visibility: visible; }
  .icon-btn.delete-item { visibility: hidden; margin-left: auto; }

  .action-check {
    width: 16px; height: 16px;
    border-radius: 5px;
    border: 1.5px solid var(--line);
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 10px;
    color: transparent;
    transition: all 0.15s ease;
    background: var(--paper-raised);
  }
  .action-check.checked {
    background: var(--done);
    border-color: var(--done);
    color: white;
  }
  .action-letter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-faint);
    width: 12px;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .action-text {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.45;
    flex: 1;
    cursor: text;
  }
  .action-text.checked {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
  }
  .action-owner {
    font-size: 10.5px;
    color: var(--ink-faint);
    font-style: italic;
    margin-top: 2px;
  }

  .add-action {
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-faint);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding-left: 8px;
  }
  .add-action:hover { color: var(--thread); }

  .add-subthread-col {
    width: 150px;
    flex-shrink: 0;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--ink-faint);
    font-size: 13px;
    cursor: pointer;
    min-height: 46px;
    align-self: flex-start;
    margin-top: 0;
    padding: 12px;
  }
  .add-subthread-col:hover { color: var(--amber); border-color: var(--amber); }

  .add-thread-card {
    border: 1.5px dashed var(--canvas-line);
    border-radius: 14px;
    padding: 18px 22px;
    color: var(--canvas-ink-faint);
    font-size: 14.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .add-thread-card:hover { border-color: var(--amber); color: var(--amber); }

  .plus-icon {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  .plus-icon.small { width: 14px; height: 14px; font-size: 10px; }

  .footnote {
    max-width: 1200px;
    margin: 30px auto 0;
    padding: 0 32px;
    font-size: 12.5px;
    color: var(--canvas-ink-faint);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .footnote-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }

  .empty-state {
    color: var(--canvas-ink-faint);
    font-size: 14px;
    padding: 20px 4px;
  }

  .thread-header[draggable="true"] { cursor: grab; }
  .thread-header[draggable="true"]:active { cursor: grabbing; }
  .thread.dragging { opacity: 0.5; }
  .thread.drag-over { outline: 2px dashed var(--amber); outline-offset: 2px; }

  .thread-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--paper-raised);
    background: var(--ink);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .thread-titleblock {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    gap: 2px;
  }

  .thread-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-faint);
  }

  .action-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .subthread-header[draggable="true"] { cursor: grab; }
  .subthread-header[draggable="true"]:active { cursor: grabbing; }
  .subthread.dragging { opacity: 0.5; }
  .subthread.sub-drag-over { outline: 2px dashed var(--amber); outline-offset: 2px; }

  .thread-color-wrap { position: relative; display: flex; align-items: center; flex-shrink: 0; }
  .thread-color-btn {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    cursor: pointer;
    flex-shrink: 0;
  }
  .color-popover {
    position: absolute;
    top: 24px;
    right: 0;
    display: none;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    width: 168px;
    max-height: 220px;
    overflow-y: auto;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    z-index: 60;
  }
  .color-popover.open { display: grid; }
  .color-swatch {
    width: 20px; height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 1.5px solid rgba(0,0,0,0.15);
  }
  .color-swatch.selected { outline: 2px solid var(--ink); outline-offset: 1px; }

  .tab-bar {
    display: flex;
    gap: 4px;
    margin-top: 18px;
    border-bottom: 1px solid var(--canvas-line);
  }
  .tab-btn {
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--canvas-ink-faint);
    padding: 9px 4px 11px;
    margin-right: 22px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn:hover { color: var(--canvas-ink); }
  .tab-btn.active { color: var(--canvas-ink); border-bottom-color: var(--amber); }
  .proposals-count-badge {
    display: inline-block;
    background: var(--amber);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    border-radius: 8px;
    padding: 1px 6px;
    margin-left: 6px;
  }

  .proposal-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(31,41,55,0.04);
  }
  .proposal-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .proposal-field { margin-bottom: 14px; }
  .proposal-field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .proposal-flag-new {
    display: inline-block;
    background: var(--amber-soft);
    color: var(--amber);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-radius: 5px;
    padding: 2px 6px;
    margin-left: 6px;
  }
  .proposal-input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
  }
  .proposal-input.small-gap { margin-top: 8px; }
  .proposal-row-half { display: flex; gap: 12px; }
  .proposal-row-half > .proposal-field { flex: 1; min-width: 0; }
  .proposal-rationale { font-style: italic; color: var(--ink-faint); font-size: 13px; margin: 4px 0 0; }
  .proposal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .proposal-commit-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    background: var(--amber);
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .proposal-commit-btn:hover { opacity: 0.92; }
  .proposal-commit-btn:disabled { opacity: 0.5; cursor: default; }
  .proposal-dismiss-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--danger);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }

  .meetings-toolbar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--canvas-ink);
    background: var(--paper-raised);
    border: 1px solid var(--canvas-line);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .refresh-btn:hover { opacity: 0.9; }

  .meeting-card {
    display: flex;
    gap: 16px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 5px solid var(--gcal-blue, #4285F4);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(31,41,55,0.04);
  }
  .meeting-icon {
    flex: none;
    width: 34px;
    height: 34px;
    margin-top: 2px;
  }
  .meeting-body { flex: 1; min-width: 0; }
  .meeting-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .meeting-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    margin-bottom: 8px;
  }
  .meeting-attendees { font-size: 13px; color: var(--ink-faint); margin-bottom: 10px; }
  .meeting-attachments { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .meeting-attachment {
    font-size: 12.5px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .transcript-badge {
    display: inline-block;
    background: var(--amber-soft);
    color: var(--amber);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-radius: 5px;
    padding: 2px 6px;
  }
  .extract-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: #fff;
    background: var(--amber);
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .extract-btn:hover { opacity: 0.92; }
  .extract-btn:disabled { cursor: default; opacity: 0.6; }
  .extract-btn.extracted {
    background: var(--paper-recessed);
    color: var(--ink-faint);
  }

  .person-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(31,41,55,0.04);
  }
  .person-card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 22px;
    border-bottom: 1px solid transparent;
    cursor: pointer;
    user-select: none;
  }
  .person-card.open .person-card-header { border-bottom: 1px solid var(--line); }
  .person-chevron {
    color: var(--ink-faint);
    font-size: 12px;
    transition: transform 0.2s ease;
    width: 14px;
    flex-shrink: 0;
  }
  .person-card.open .person-chevron { transform: rotate(90deg); }
  .person-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper-raised);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .person-name {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--ink);
    flex: 1;
  }
  .person-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .person-list { display: none; flex-direction: column; gap: 2px; padding: 8px 12px 14px; }
  .person-card.open .person-list { display: flex; }
  .person-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 7px;
  }
  .person-item:hover { background: var(--paper-recessed); }
  .person-check {
    width: 16px; height: 16px;
    border-radius: 5px;
    border: 1.5px solid var(--line);
    flex-shrink: 0;
    margin-top: 2px;
    cursor: pointer;
    background: var(--paper-raised);
  }
  .person-item-text {
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.45;
  }
  .person-item-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
  }
  .person-item-thread { font-weight: 600; }
  .person-item-tag { letter-spacing: 0.02em; }
  .person-item-date { color: var(--ink-faint); }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">Vishnu's Landscape</span>
      <span class="brand-sub">Great Learning Workspace</span>
    </div>
    <div class="sync-chip">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncLabel">synced</span>
    </div>
  </div>

  <div class="page-header">
    <div class="breadcrumb" id="breadcrumbText">Vishnu's Landscape / All Threads</div>
    <div class="page-title" id="pageTitleText">All Threads</div>
    <div class="page-meta" id="pageMeta">
      <span id="metaThreadCount">0 threads</span>
      <span class="meta-dot">·</span>
      <span id="metaItemCount">0 items open</span>
      <span class="meta-dot">·</span>

  <div class="footnote">

    Runs as a Google Apps Script web app · data lives in a linked Google Sheet · polling every 5s

<script>
  var boardData = { board: [], lastModified: 0 };
  var pollTimer = null;

  // Hardcoded light-color palette for threads, ordered VIBGYOR (violet through

  // card/text colors that swap in together via CSS custom properties scoped
  // to that thread's own element, so everything nested inside (sub-thread
  // cards, text, dots, connectors) re-themes automatically. `tag` is
  // deliberately a different hue family than `ink` (teal vs. amber) so a
  // sub-thread's tag label always stays visually distinct from its body text
  // regardless of which of the 31 colors the thread uses.
  var THREAD_COLOR_ORDER = [
    "amethyst", "grape", "wisteria", "lavender", "lilac",

    lavender:     { label: "Lavender",        raised: "#F1EAFC", recessed: "#E3D9F8", ink: "#4B2A7A", inkFaint: "#8E76B0", line: "rgba(75,42,122,0.14)",   accent: "#4B2A7A", accentLight: "rgba(75,42,122,0.3)",   tag: TAG_AMBER },
    lilac:        { label: "Lilac",           raised: "#F8EAFC", recessed: "#F0D9F8", ink: "#6A2A6E", inkFaint: "#A876AC", line: "rgba(106,42,110,0.14)",  accent: "#6A2A6E", accentLight: "rgba(106,42,110,0.3)",  tag: TAG_AMBER },
    cobalt:       { label: "Cobalt",          raised: "#E8EDFC", recessed: "#D3DEF8", ink: "#1B3A8A", inkFaint: "#6E7EB8", line: "rgba(27,58,138,0.14)",   accent: "#1B3A8A", accentLight: "rgba(27,58,138,0.3)",   tag: TAG_AMBER },
    blueberry:    { label: "Blueberry",       raised: "#ECEBF9", recessed: "#DAD8F3", ink: "#3D3B7A", inkFaint: "#8482B0", line: "rgba(61,59,122,0.14)",   accent: "#3D3B7A", accentLight: "rgba(61,59,122,0.3)",   tag: TAG_AMBER },
    blue:         { label: "Blue",            raised: "#EAF2FC", recessed: "#D9E6F8", ink: "#0B2A5B", inkFaint: "#6683AD", line: "rgba(11,42,91,0.14)",    accent: "#0B2A5B", accentLight: "rgba(11,42,91,0.3)",    tag: TAG_AMBER },
    peacock:      { label: "Peacock",         raised: "#E8F7F8", recessed: "#D2F0F2", ink: "#0E6E7C", inkFaint: "#63A3AC", line: "rgba(14,110,124,0.14)",  accent: "#0E6E7C", accentLight: "rgba(14,110,124,0.3)",  tag: TAG_AMBER },
    eucalyptus:   { label: "Eucalyptus",      raised: "#EAF7F3", recessed: "#D5F0E8", ink: "#2E7D6B", inkFaint: "#7BAEA0", line: "rgba(46,125,107,0.14)",  accent: "#2E7D6B", accentLight: "rgba(46,125,107,0.3)",  tag: TAG_AMBER },
    green:        { label: "Green",           raised: "#EAFCF0", recessed: "#D9F8E3", ink: "#145A32", inkFaint: "#5FA37F", line: "rgba(20,90,50,0.14)",    accent: "#145A32", accentLight: "rgba(20,90,50,0.3)",    tag: TAG_AMBER },
    basil:        { label: "Basil",           raised: "#E9F5EC", recessed: "#D3EBD9", ink: "#1F4D2B", inkFaint: "#6C9678", line: "rgba(31,77,43,0.14)",    accent: "#1F4D2B", accentLight: "rgba(31,77,43,0.3)",    tag: TAG_AMBER },
    avocado:      { label: "Avocado",         raised: "#F3F7E9", recessed: "#E7EFD2", ink: "#55701F", inkFaint: "#9AAD6E", line: "rgba(85,112,31,0.14)",   accent: "#55701F", accentLight: "rgba(85,112,31,0.3)",   tag: TAG_AMBER },
    pistachio:    { label: "Pistachio",       raised: "#EFF7EC", recessed: "#DFF0D8", ink: "#4C7A3C", inkFaint: "#8FB07F", line: "rgba(76,122,60,0.14)",   accent: "#4C7A3C", accentLight: "rgba(76,122,60,0.3)",   tag: TAG_AMBER },
    sage:         { label: "Sage",            raised: "#F0F3EC", recessed: "#E1E7D9", ink: "#5E6E52", inkFaint: "#9DA890", line: "rgba(94,110,82,0.14)",   accent: "#5E6E52", accentLight: "rgba(94,110,82,0.3)",   tag: TAG_AMBER },
    citron:       { label: "Citron",          raised: "#FAFAE9", recessed: "#F4F4D2", ink: "#7A7A0B", inkFaint: "#B3B366", line: "rgba(122,122,11,0.14)",  accent: "#7A7A0B", accentLight: "rgba(122,122,11,0.3)",  tag: TAG_TEAL },
    yellow:       { label: "Yellow",          raised: "#FCF8EA", recessed: "#F8EFD9", ink: "#7A5D0B", inkFaint: "#B39B66", line: "rgba(122,93,11,0.14)",   accent: "#7A5D0B", accentLight: "rgba(122,93,11,0.3)",   tag: TAG_TEAL },
    banana:       { label: "Banana",          raised: "#FCFAEA", recessed: "#F8F3D3", ink: "#8A7A1F", inkFaint: "#BDAF6E", line: "rgba(138,122,31,0.14)",  accent: "#8A7A1F", accentLight: "rgba(138,122,31,0.3)",  tag: TAG_TEAL },
    mango:        { label: "Mango",           raised: "#FCF3EA", recessed: "#F8E6D3", ink: "#8A5A0B", inkFaint: "#BD9966", line: "rgba(138,90,11,0.14)",   accent: "#8A5A0B", accentLight: "rgba(138,90,11,0.3)",   tag: TAG_TEAL },
    tangerine:    { label: "Tangerine",       raised: "#FCF0E5", recessed: "#F8E0CC", ink: "#8A4A0B", inkFaint: "#BD8C66", line: "rgba(138,74,11,0.14)",   accent: "#8A4A0B", accentLight: "rgba(138,74,11,0.3)",   tag: TAG_TEAL },
    pumpkin:      { label: "Pumpkin",         raised: "#FCEEE5", recessed: "#F8DCCB", ink: "#8A3E0B", inkFaint: "#BD8466", line: "rgba(138,62,11,0.14)",   accent: "#8A3E0B", accentLight: "rgba(138,62,11,0.3)",   tag: TAG_TEAL },
    orange:       { label: "Orange",          raised: "#FCF0EA", recessed: "#F8E1D9", ink: "#8A3A0B", inkFaint: "#C08F66", line: "rgba(138,58,11,0.14)",   accent: "#8A3A0B", accentLight: "rgba(138,58,11,0.3)",   tag: TAG_TEAL },
    tomato:       { label: "Tomato",          raised: "#FCEBE5", recessed: "#F8D6CC", ink: "#8A2A0B", inkFaint: "#BD7666", line: "rgba(138,42,11,0.14)",   accent: "#8A2A0B", accentLight: "rgba(138,42,11,0.3)",   tag: TAG_TEAL },
    radicchio:    { label: "Radicchio",       raised: "#F8E8EC", recessed: "#F0D1D9", ink: "#6E1A2E", inkFaint: "#AD7181", line: "rgba(110,26,46,0.14)",   accent: "#6E1A2E", accentLight: "rgba(110,26,46,0.3)",   tag: TAG_TEAL },
    cherryblossom:{ label: "Cherry Blossom",  raised: "#FCEEF3", recessed: "#F8DCE7", ink: "#8A3A5E", inkFaint: "#BD8FA5", line: "rgba(138,58,94,0.14)",   accent: "#8A3A5E", accentLight: "rgba(138,58,94,0.3)",   tag: TAG_TEAL },
    flamingo:     { label: "Flamingo",        raised: "#FCF0F1", recessed: "#F8E1E3", ink: "#8A4A5A", inkFaint: "#BD97A0", line: "rgba(138,74,90,0.14)",   accent: "#8A4A5A", accentLight: "rgba(138,74,90,0.3)",   tag: TAG_TEAL },
    red:          { label: "Red",             raised: "#FCEAEA", recessed: "#F8D9D9", ink: "#7A1F1F", inkFaint: "#B06666", line: "rgba(122,31,31,0.14)",   accent: "#7A1F1F", accentLight: "rgba(122,31,31,0.3)",   tag: TAG_TEAL },
    gray:         { label: "Gray",            raised: "#F1F2F4", recessed: "#E3E5E9", ink: "#3A3F47", inkFaint: "#7D838C", line: "rgba(58,63,71,0.14)",    accent: "#3A3F47", accentLight: "rgba(58,63,71,0.3)",    tag: TAG_AMBER },
    graphite:     { label: "Graphite",        raised: "#EDEEF0", recessed: "#DBDDE1", ink: "#2A2E33", inkFaint: "#74787D", line: "rgba(42,46,51,0.14)",    accent: "#2A2E33", accentLight: "rgba(42,46,51,0.3)",    tag: TAG_AMBER },
    cocoa:        { label: "Cocoa",           raised: "#F5EFEA", recessed: "#EBDFD5", ink: "#5A3A24", inkFaint: "#A38670", line: "rgba(90,58,36,0.14)",    accent: "#5A3A24", accentLight: "rgba(90,58,36,0.3)",    tag: TAG_TEAL },
    birch:        { label: "Birch",           raised: "#F7F3EE", recessed: "#EFE7DC", ink: "#6E5A42", inkFaint: "#ABA08D", line: "rgba(110,90,66,0.14)",   accent: "#6E5A42", accentLight: "rgba(110,90,66,0.3)",   tag: TAG_TEAL }
  };

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function setSyncing(isSyncing) {
    document.getElementById("syncDot").classList.toggle("syncing", isSyncing);
    document.getElementById("syncLabel").textContent = isSyncing ? "syncing…" : "synced";
  }

  function timeAgo(ts) {
    if (!ts) return "never";
    var diff = Math.max(0, Date.now() - ts);
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    return Math.floor(hrs / 24) + "d ago";
  }

  // ---- Rendering ----

  function renderBoard() {
    var container = document.getElementById("container");
    var board = boardData.board || [];

    var totalItems = 0, openItems = 0;
    board.forEach(function (t) {
      t.subthreads.forEach(function (s) {
        s.items.forEach(function (i) {
          totalItems++;
          if (!i.checked) openItems++;
        });
      });
    });
    document.getElementById("metaThreadCount").textContent = board.length + (board.length === 1 ? " thread" : " threads");
    document.getElementById("metaItemCount").textContent = openItems + " of " + totalItems + " items open";
    document.getElementById("metaUpdated").textContent = "updated " + timeAgo(boardData.lastModified);

    if (board.length === 0) {
      container.innerHTML = '<div class="empty-state">No threads yet.</div>' + renderAddThreadCard();
      return;
    }

    container.innerHTML = board.map(function (t, idx) { return renderThread(t, idx + 1); }).join("") + renderAddThreadCard();
  }

  function renderAddThreadCard() {
    return '<div class="add-thread-card" data-action="add-thread"><span class="plus-icon">+</span> New thread</div>';
  }

  function renderThread(t, num) {
    var done = 0, total = t.subthreads.reduce(function (acc, s) { return acc + s.items.length; }, 0);
    t.subthreads.forEach(function (s) { s.items.forEach(function (i) { if (i.checked) done++; }); });
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    var subsHtml = t.subthreads.map(renderSubthread).join('<div class="subthread-connector"></div>');
    if (t.subthreads.length > 0) subsHtml += '<div class="subthread-connector"></div>';

    var colorKey = t.color || "blue";
    var palette = THREAD_COLORS[colorKey] || THREAD_COLORS.blue;
    var themeStyle =
      '--paper-raised:' + palette.raised + ';' +
      '--paper-recessed:' + palette.recessed + ';' +
      '--ink:' + palette.ink + ';' +
      '--ink-faint:' + palette.inkFaint + ';' +
      '--line:' + palette.line + ';' +
      '--tag:' + palette.tag + ';' +
      '--thread:' + palette.accent + ';' +
      '--thread-light:' + palette.accentLight + ';';

    var swatchesHtml = THREAD_COLOR_ORDER.map(function (key) {
      var p = THREAD_COLORS[key];
      return '<span class="color-swatch' + (key === colorKey ? " selected" : "") + '" data-action="set-thread-color" data-thread-id="' + t.threadId + '" data-color="' + key + '" style="background:' + p.accent + ';" title="' + p.label + '"></span>';
    }).join("");

    return (
      '<div class="thread' + (t.collapsed ? "" : " open") + '" data-thread-id="' + t.threadId + '" style="' + themeStyle + '">' +
        '<div class="thread-header" draggable="true" data-action="toggle-thread" data-thread-id="' + t.threadId + '">' +
          '<span class="chevron">▶</span>' +
          '<span class="thread-number">' + num + '</span>' +
          '<div class="thread-titleblock" data-action="rename-thread" data-thread-id="' + t.threadId + '">' +
            '<span class="thread-title">' + escapeHtml(t.name) + "</span>" +
            (t.dateOpened ? '<span class="thread-date">Opened ' + escapeHtml(t.dateOpened) + "</span>" : "") +
          "</div>" +
          '<div class="thread-progress">' +
            '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
            '<span class="progress-label">' + done + "/" + total + "</span>" +
          "</div>" +
          '<div class="thread-color-wrap">' +
            '<span class="thread-color-btn" data-action="toggle-color-picker" data-thread-id="' + t.threadId + '" style="background:' + palette.accent + ';" title="Thread color: ' + palette.label + '"></span>' +
            '<div class="color-popover" data-color-popover="' + t.threadId + '">' + swatchesHtml + "</div>" +
          "</div>" +
          '<span class="icon-btn" data-action="delete-thread" data-thread-id="' + t.threadId + '" title="Delete thread">✕</span>' +
        "</div>" +
        '<div class="thread-body"><div class="subthread-row">' +
          subsHtml +
          '<div class="add-subthread-col" data-action="add-subthread" data-thread-id="' + t.threadId + '">' +
            '<span class="plus-icon small">+</span> New sub-thread' +
          "</div>" +
        "</div></div>" +
      "</div>"
    );
  }

  function renderSubthread(s) {
    var itemsHtml = s.items.map(function (i) { return renderItem(i, s.subThreadId); }).join("");
    return (
      '<div class="subthread' + (s.collapsed ? "" : " open") + '" data-subthread-id="' + s.subThreadId + '">' +
        '<div class="subthread-header" draggable="true" data-action="toggle-subthread" data-subthread-id="' + s.subThreadId + '">' +
          '<span class="subthread-dot"></span>' +
          '<div class="subthread-titlewrap" data-action="rename-subthread" data-subthread-id="' + s.subThreadId + '">' +
            '<div class="subthread-name">' + escapeHtml(s.name) + "</div>" +
            (s.tag ? '<span class="subthread-tag">' + escapeHtml(s.tag) + "</span>" : "") +
            (s.dateOpened ? '<span class="subthread-date">Opened ' + escapeHtml(s.dateOpened) + "</span>" : "") +
          "</div>" +
          '<span class="icon-btn" data-action="delete-subthread" data-subthread-id="' + s.subThreadId + '" title="Delete sub-thread">✕</span>' +
          '<span class="subthread-chevron">▶</span>' +
        "</div>" +
        '<div class="subthread-content">' +
          '<div class="action-list">' + itemsHtml + "</div>" +
          '<div class="add-action" data-action="add-item" data-subthread-id="' + s.subThreadId + '">' +
            '<span class="plus-icon small">+</span> add step' +
          "</div>" +
        "</div>" +
      "</div>"
    );
  }

  // Opening date == closing date means still open/WIP (that's the convention
  // used when an item is first added); anything else means it actually
  // closed on that date. Independent of the checked/strikethrough state.
  function formatItemDateRange(openDate, closeDate) {
    if (!openDate) return "";
    if (!closeDate || closeDate === openDate) return "Opened " + openDate + " · WIP";
    return "Opened " + openDate + " → Closed " + closeDate;
  }

  function renderItem(i, subThreadId) {
    return (
      '<div class="action-item" data-item-id="' + i.itemId + '" ' +
        'data-open-date="' + escapeHtml(i.openDate || "") + '" data-close-date="' + escapeHtml(i.closeDate || "") + '">' +
        '<span class="action-letter">' + i.letter + "</span>" +
        '<div class="action-check' + (i.checked ? " checked" : "") + '" data-action="toggle-item" data-item-id="' + i.itemId + '">' +
          (i.checked ? "✓" : "") +
        "</div>" +
        '<div style="flex:1; min-width:0;">' +
          '<div class="action-text' + (i.checked ? " checked" : "") + '" data-action="edit-item" data-item-id="' + i.itemId + '">' + escapeHtml(i.text) + "</div>" +
          (i.owner ? '<div class="action-owner">' + escapeHtml(i.owner) + "</div>" : "") +
          (i.openDate ? '<div class="action-date">' + escapeHtml(formatItemDateRange(i.openDate, i.closeDate)) + "</div>" : "") +
        "</div>" +
        '<span class="icon-btn delete-item" data-action="delete-item" data-item-id="' + i.itemId + '" title="Delete step">✕</span>' +
      "</div>"
    );
  }

  // ---- Threads for Each Person (pivoted view, computed client-side from
  // the same boardData - no separate backend call needed) ----

  function initialsFor(name) {
    var parts = String(name).trim().split(/\s+/);
    if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function computePersonMap(board) {
    var map = {};
    board.forEach(function (t) {
      var palette = THREAD_COLORS[t.color || "blue"] || THREAD_COLORS.blue;
      t.subthreads.forEach(function (s) {
        s.items.forEach(function (i) {
          if (i.checked) return;
          var owner = (i.owner || "").trim();
          if (!owner) return;
          if (!map[owner]) map[owner] = [];
          map[owner].push({
            itemId: i.itemId,
            text: i.text,
            date: formatItemDateRange(i.openDate, i.closeDate),
            threadName: t.name,
            threadInk: palette.ink,
            threadTag: palette.tag,
            subThreadTag: s.tag
          });
        });
      });
    });
    return map;
  }

  function renderPersonItem(e) {
    return (
      '<div class="person-item" data-item-id="' + e.itemId + '">' +
        '<div class="person-check" data-action="toggle-item" data-item-id="' + e.itemId + '"></div>' +
        '<div style="flex:1; min-width:0;">' +
          '<div class="person-item-text">' + escapeHtml(e.text) + "</div>" +
          '<div class="person-item-meta">' +
            '<span class="person-item-thread" style="color:' + e.threadInk + ';">' + escapeHtml(e.threadName) + "</span>" +
            (e.subThreadTag ? '<span class="person-item-tag" style="color:' + e.threadTag + ';">' + escapeHtml(e.subThreadTag) + "</span>" : "") +
            (e.date ? '<span class="person-item-date">' + escapeHtml(e.date) + "</span>" : "") +
          "</div>" +
        "</div>" +
      "</div>"
    );
  }

  // Owners collapsed by the user this session - not persisted server-side
  // (there's no "owner" row in the Sheet to store it against), so this
  // resets on reload, same as it would for a set of ad hoc filters.
  var collapsedOwners = {};

  function renderPersonCard(owner, entries) {
    var isOpen = !collapsedOwners[owner];
    return (
      '<div class="person-card' + (isOpen ? " open" : "") + '" data-owner="' + escapeHtml(owner) + '">' +
        '<div class="person-card-header" data-action="toggle-person" data-owner="' + escapeHtml(owner) + '">' +
          '<span class="person-chevron">▶</span>' +
          '<span class="person-avatar">' + initialsFor(owner) + "</span>" +
          '<span class="person-name">' + escapeHtml(owner) + "</span>" +
          '<span class="person-count">' + entries.length + (entries.length === 1 ? " open item" : " open items") + "</span>" +
        "</div>" +
        '<div class="person-list">' + entries.map(renderPersonItem).join("") + "</div>" +
      "</div>"
    );
  }

  function renderPersonBoard() {
    var container = document.getElementById("personContainer");
    var map = computePersonMap(boardData.board || []);
    var owners = Object.keys(map).sort(function (a, b) { return a.localeCompare(b); });
    if (owners.length === 0) {
      container.innerHTML = '<div class="empty-state">No open items with an owner assigned yet.</div>';
      return;
    }
    container.innerHTML = owners.map(function (owner) { return renderPersonCard(owner, map[owner]); }).join("");
  }

  // ---- Meetings (Calendar browser) ----
  // Deliberately NOT auto-polled - Calendar API calls are heavier/quota
  // limited than a Sheet read, and calendar history doesn't change every 5
  // seconds anyway. Loads once when the tab is opened, plus a manual
  // Refresh button.

  var CALENDAR_ICON_SVG =
    '<svg class="meeting-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<rect x="3" y="4" width="18" height="17" rx="2.5" fill="#EAF2FC" stroke="#4285F4" stroke-width="1.5"/>' +
    '<rect x="3" y="4" width="18" height="5" rx="2" fill="#4285F4"/>' +
    '<line x1="7" y1="2.5" x2="7" y2="6" stroke="#4285F4" stroke-width="1.6" stroke-linecap="round"/>' +
    '<line x1="17" y1="2.5" x2="17" y2="6" stroke="#4285F4" stroke-width="1.6" stroke-linecap="round"/>' +
    '<text x="12" y="17.5" font-size="9" font-family="Inter, sans-serif" font-weight="600" fill="#4285F4" text-anchor="middle">31</text>' +
    "</svg>";

  function formatMeetingWhen(m) {
    if (!m.start) return "";
    if (m.isAllDay) {
      return new Date(m.start).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " (all day)";
    }
    var start = new Date(m.start);
    var end = m.end ? new Date(m.end) : null;
    var dateStr = start.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    var startTime = start.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    var endTime = end ? end.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : "";
    return dateStr + " · " + startTime + (endTime ? " – " + endTime : "");
  }

  function loadMeetings() {
    var container = document.getElementById("meetingsContainer");
    container.innerHTML = '<div class="empty-state">Loading meetings…</div>';
    google.script.run
      .withSuccessHandler(function (meetings) {
        renderMeetings(meetings || []);
      })
      .withFailureHandler(function (err) {
        container.innerHTML = '<div class="empty-state">Error loading meetings: ' + escapeHtml(err.message) + "</div>";
      })
      .getCalendarMeetingsWithAttachments();
  }

  function renderMeetings(meetings) {
    var container = document.getElementById("meetingsContainer");
    var toolbar = '<div class="meetings-toolbar"><button class="refresh-btn" id="refreshMeetingsBtn">&#8635; Refresh</button></div>';
    if (!meetings.length) {
      container.innerHTML = toolbar + '<div class="empty-state">No meetings with attachments found since May 19, 2026.</div>';
      document.getElementById("refreshMeetingsBtn").addEventListener("click", loadMeetings);
      return;
    }
    container.innerHTML = toolbar + meetings.map(renderMeetingCard).join("");
    document.getElementById("refreshMeetingsBtn").addEventListener("click", loadMeetings);
  }

  function renderMeetingCard(m) {
    var attachmentsHtml = m.attachments.map(function (a) {
      return '<div class="meeting-attachment">' +
        (a.looksLikeTranscript ? '<span class="transcript-badge">Transcript</span>' : "&#128206;") +
        " " + escapeHtml(a.title) + "</div>";
    }).join("");

    var attendeesHtml = m.attendees.length
      ? '<div class="meeting-attendees">With: ' + escapeHtml(m.attendees.join(", ")) + "</div>"
      : "";

    var buttonHtml;
    if (m.extracted) {
      buttonHtml = '<button class="extract-btn extracted" disabled>Action Items Extracted</button>';
    } else if (m.hasTranscript) {
      buttonHtml = '<button class="extract-btn" data-action="extract-items" data-event-id="' + escapeHtml(m.eventId) + '">Extract Action Items</button>';
    } else {
      buttonHtml = '<span class="meeting-meta">No Gemini transcript detected among the attachments.</span>';
    }

    return (
      '<div class="meeting-card" style="border-left-color:' + escapeHtml(m.colorBackground) + '">' +
        CALENDAR_ICON_SVG +
        '<div class="meeting-body">' +
          '<div class="meeting-title">' + escapeHtml(m.title) + "</div>" +
          '<div class="meeting-meta">' + escapeHtml(formatMeetingWhen(m)) + "</div>" +
          attendeesHtml +
          '<div class="meeting-attachments">' + attachmentsHtml + "</div>" +
          buttonHtml +
        "</div>" +
      "</div>"
    );
  }

  document.getElementById("meetingsContainer").addEventListener("click", function (e) {
    var el = e.target.closest('[data-action="extract-items"]');
    if (!el) return;
    var eventId = el.getAttribute("data-event-id");
    el.disabled = true;
    el.textContent = "Extracting…";
    google.script.run
      .withSuccessHandler(function (count) {
        loadMeetings();
        loadPendingApprovals();
        setActiveTab("pending");
      })
      .withFailureHandler(function (err) {
        alert("Error: " + err.message);
        el.disabled = false;
        el.textContent = "Extract Action Items";
      })
      .extractActionItemsForMeeting(eventId);
  });

  // ---- Action Items Pending for Approval (in-app review, no email) ----
  // This tab only exists in the tab bar while there's at least one
  // "proposed" item - it's checked on the same 5-second poll as the board,
  // appears the moment a meeting is extracted, and disappears again once
  // every item from it has been accepted or rejected.

  var pendingProposals = [];

  function computeBoardMap(board) {
    var map = {};
    board.forEach(function (t) {
      map[t.name] = t.subthreads.map(function (s) { return { name: s.name, tag: s.tag }; });
    });
    return map;
  }

  function loadPendingApprovals() {
    google.script.run
      .withSuccessHandler(function (proposals) {
        pendingProposals = proposals || [];
        var tabBtn = document.getElementById("pendingTabBtn");
        var badge = document.getElementById("pendingCountBadge");
        if (pendingProposals.length) {
          badge.textContent = pendingProposals.length;
          tabBtn.style.display = "";
        } else {
          tabBtn.style.display = "none";
          // The tab it was showing no longer exists - fall back to Meetings
          // rather than leaving an empty/vanished tab marked active.
          if (activeTab === "pending") setActiveTab("meetings");
        }
        if (activeTab === "pending") renderPendingApprovals();
      })
      .withFailureHandler(function (err) { console.error(err); })
      .getPendingProposals();
  }

  function renderPendingApprovals() {
    var container = document.getElementById("pendingContainer");
    if (!pendingProposals.length) {
      container.innerHTML = '<div class="empty-state">No pending action items right now.</div>';
      return;
    }
    var boardMap = computeBoardMap(boardData.board || []);
    container.innerHTML = pendingProposals.map(function (p) { return renderProposalCard(p, boardMap); }).join("");
    container.querySelectorAll(".proposal-card").forEach(function (card) {
      initProposalCardSubOptions(card, boardMap);
    });
  }

  function renderProposalCard(p, boardMap) {
    var threadNames = Object.keys(boardMap);
    var threadMatches = threadNames.indexOf(p.ThreadName) !== -1;
    var useNewThread = p.IsNewThread || !threadMatches;
    var useNewSubThread = useNewThread || p.IsNewSubThread;

    var threadOptions = threadNames.map(function (name) {
      var selected = (!useNewThread && name === p.ThreadName) ? " selected" : "";
      return '<option value="' + escapeHtml(name) + '"' + selected + ">" + escapeHtml(name) + "</option>";
    }).join("");

    return (
      '<div class="proposal-card" data-token="' + escapeHtml(p.Token) + '" ' +
        'data-sub-name="' + escapeHtml(p.SubThreadName) + '" data-is-new-sub="' + (p.IsNewSubThread ? "1" : "0") + '">' +
        '<div class="proposal-meta">From meeting &middot; ' + escapeHtml(p.MeetingTitle) + "</div>" +
        '<div class="proposal-field"><label>Item text</label>' +
          '<textarea class="proposal-input proposal-text-input" rows="2">' + escapeHtml(p.Text) + "</textarea></div>" +
        '<div class="proposal-row-half">' +
          '<div class="proposal-field"><label>Owner</label>' +
            '<input class="proposal-input proposal-owner-input" type="text" value="' + escapeHtml(p.Owner) + '"></div>' +
          '<div class="proposal-field"><label>Opening date</label>' +
            '<input class="proposal-input proposal-open-date" type="date" value="' + escapeHtml(p.OpenDate) + '"></div>' +
          '<div class="proposal-field"><label>Closing date</label>' +
            '<input class="proposal-input proposal-close-date" type="date" value="' + escapeHtml(p.OpenDate) + '"></div>' +
        "</div>" +
        '<div class="proposal-field"><label>Thread' +
          (p.IsNewThread ? '<span class="proposal-flag-new">proposed new</span>' : "") + "</label>" +
          '<select class="proposal-input proposal-thread-select">' + threadOptions +
          '<option value="__new__"' + (useNewThread ? " selected" : "") + ">+ Add New Thread</option></select>" +
          '<input class="proposal-input proposal-new-thread-input small-gap" type="text" placeholder="New thread name" ' +
          'value="' + escapeHtml(p.ThreadName) + '" style="display:' + (useNewThread ? "block" : "none") + ';"></div>' +
        '<div class="proposal-field proposal-subthread-dropdown-field" style="display:' + (useNewThread ? "none" : "block") + '">' +
          "<label>Sub-thread" + (p.IsNewSubThread ? '<span class="proposal-flag-new">proposed new</span>' : "") + "</label>" +
          '<select class="proposal-input proposal-subthread-select"></select></div>' +
        '<div class="proposal-field proposal-new-subthread-field" style="display:' + (useNewSubThread ? "block" : "none") + '">' +
          "<label>" + (useNewThread ? "Sub-thread name (thread is new, so no list to pick from)" : "New sub-thread name") + "</label>" +
          '<input class="proposal-input proposal-new-subthread-name" type="text" placeholder="Sub-thread name" ' +
          'value="' + escapeHtml(p.SubThreadName) + '">' +
          '<input class="proposal-input proposal-new-subthread-tag small-gap" type="text" placeholder="Tag (optional)" ' +
          'value="' + escapeHtml(p.SubThreadTag) + '"></div>' +
        '<p class="proposal-rationale">' + escapeHtml(p.Rationale) + "</p>" +
        '<div class="proposal-actions">' +
          '<button class="proposal-commit-btn" data-action="commit-proposal">Accept with Edits</button>' +
          '<button class="proposal-dismiss-btn" data-action="dismiss-proposal">Reject</button>' +
        "</div>" +
      "</div>"
    );
  }

  function populateProposalSubOptions(card, boardMap, selectedName, isNewSub) {
    var threadSelect = card.querySelector(".proposal-thread-select");
    var subSelect = card.querySelector(".proposal-subthread-select");
    var subs = (threadSelect.value === "__new__") ? [] : (boardMap[threadSelect.value] || []);
    subSelect.innerHTML = "";
    subs.forEach(function (s) {
      var opt = document.createElement("option");
      opt.value = s.name;
      opt.textContent = s.name;
      if (!isNewSub && s.name === selectedName) opt.selected = true;
      subSelect.appendChild(opt);
    });
    var newOpt = document.createElement("option");
    newOpt.value = "__new__";
    newOpt.textContent = "+ Add New Subthread";
    var exists = subs.some(function (s) { return s.name === selectedName; });
    if (isNewSub || !exists) newOpt.selected = true;
    subSelect.appendChild(newOpt);
  }

  function onProposalThreadChange(card, boardMap) {
    var isNewThread = card.querySelector(".proposal-thread-select").value === "__new__";
    card.querySelector(".proposal-new-thread-input").style.display = isNewThread ? "block" : "none";
    card.querySelector(".proposal-subthread-dropdown-field").style.display = isNewThread ? "none" : "block";
    if (isNewThread) {
      card.querySelector(".proposal-new-subthread-field").style.display = "block";
    } else {
      populateProposalSubOptions(card, boardMap, "", false);
      onProposalSubThreadChange(card);
    }
  }

  function onProposalSubThreadChange(card) {
    var isNewSub = card.querySelector(".proposal-subthread-select").value === "__new__";
    card.querySelector(".proposal-new-subthread-field").style.display = isNewSub ? "block" : "none";
  }

  function initProposalCardSubOptions(card, boardMap) {
    var isNewThread = card.querySelector(".proposal-thread-select").value === "__new__";
    if (!isNewThread) {
      populateProposalSubOptions(card, boardMap, card.dataset.subName, card.dataset.isNewSub === "1");
      onProposalSubThreadChange(card);
    }
  }

  document.getElementById("pendingContainer").addEventListener("change", function (e) {
    var card = e.target.closest(".proposal-card");
    if (!card) return;
    var boardMap = computeBoardMap(boardData.board || []);
    if (e.target.classList.contains("proposal-thread-select")) {
      onProposalThreadChange(card, boardMap);
    } else if (e.target.classList.contains("proposal-subthread-select")) {
      onProposalSubThreadChange(card);
    }
  });

  document.getElementById("pendingContainer").addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var card = el.closest(".proposal-card");
    var token = card.getAttribute("data-token");
    var action = el.getAttribute("data-action");

    if (action === "dismiss-proposal") {
      if (!confirm("Reject this item? It won't be added to the board.")) return;
      google.script.run
        .withSuccessHandler(loadPendingApprovals)
        .withFailureHandler(function (err) { alert("Error: " + err.message); })
        .dismissProposal(token);
      return;
    }

    if (action === "commit-proposal") {
      var threadSelect = card.querySelector(".proposal-thread-select");
      var subSelect = card.querySelector(".proposal-subthread-select");
      var isNewThread = threadSelect.value === "__new__";
      var isNewSubThread = isNewThread || subSelect.value === "__new__";
      var threadName = isNewThread ? card.querySelector(".proposal-new-thread-input").value : threadSelect.value;
      var subThreadName = isNewSubThread ? card.querySelector(".proposal-new-subthread-name").value : subSelect.value;
      var subThreadTag = isNewSubThread ? card.querySelector(".proposal-new-subthread-tag").value : "";
      var text = card.querySelector(".proposal-text-input").value;
      var owner = card.querySelector(".proposal-owner-input").value;
      var openDate = card.querySelector(".proposal-open-date").value;
      var closeDate = card.querySelector(".proposal-close-date").value;

      if (!text.trim()) { alert("Item text can't be empty."); return; }
      if (!threadName.trim()) { alert("Thread name can't be empty."); return; }
      if (!subThreadName.trim()) { alert("Sub-thread name can't be empty."); return; }

      el.disabled = true;
      google.script.run
        .withSuccessHandler(function () {
          loadPendingApprovals();
          loadBoard();
        })
        .withFailureHandler(function (err) { alert("Error: " + err.message); el.disabled = false; })
        .submitItemDecision(token, text, owner, openDate, closeDate, threadName, isNewThread, subThreadName, isNewSubThread, subThreadTag);
    }
  });

  // ---- Tab switching ----

  var activeTab = "work";

  var TAB_LABELS = {
    work: "All Threads",
    people: "Threads for Each Person",
    meetings: "Meetings",
    pending: "Action Items Pending for Approval",
  };

  function setActiveTab(tab) {
    activeTab = tab;
    document.querySelectorAll(".tab-btn").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === tab);
    });
    document.getElementById("container").style.display = tab === "work" ? "" : "none";
    document.getElementById("personContainer").style.display = tab === "people" ? "" : "none";
    document.getElementById("meetingsContainer").style.display = tab === "meetings" ? "" : "none";
    document.getElementById("pendingContainer").style.display = tab === "pending" ? "" : "none";
    document.getElementById("breadcrumbText").textContent = "Vishnu's Landscape / " + TAB_LABELS[tab];
    document.getElementById("pageTitleText").textContent = TAB_LABELS[tab];
    if (tab === "meetings") loadMeetings();
    if (tab === "pending") renderPendingApprovals();
  }

  document.querySelectorAll(".tab-btn").forEach(function (b) {
    b.addEventListener("click", function () { setActiveTab(b.getAttribute("data-tab")); });
  });

  document.getElementById("personContainer").addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action === "toggle-person") {
      var owner = el.getAttribute("data-owner");
      collapsedOwners[owner] = !collapsedOwners[owner];
      el.closest(".person-card").classList.toggle("open", !collapsedOwners[owner]);
      return;
    }
    if (action !== "toggle-item") return;
    var itemId = el.getAttribute("data-item-id");
    setSyncing(true);
    google.script.run
      .withSuccessHandler(loadBoard)
      .withFailureHandler(function (err) { console.error(err); loadBoard(); })
      .toggleItem(itemId);
  });

  // ---- Data load / poll ----

  function loadBoard() {
    setSyncing(true);
    google.script.run
      .withSuccessHandler(function (data) {
        if (data) boardData = data;
        renderBoard();
        renderPersonBoard();
        setSyncing(false);
      })
      .withFailureHandler(function (err) {
        setSyncing(false);
        console.error(err);
      })
      .getBoardData();
  }

  function pollForUpdates() {
    google.script.run
      .withSuccessHandler(function (ts) {
        if (ts != null && ts !== boardData.lastModified) loadBoard();
      })
      .withFailureHandler(function (err) { console.error(err); })
      .getLastModified();
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(pollForUpdates, 5000);
    // Same 5-second cadence as the board - this is what makes the pending
    // tab appear right after an extraction and disappear once everything in
    // it has been accepted/rejected. Cheap (one Sheet read), unlike the
    // Meetings tab's Calendar fetch, which is deliberately NOT auto-polled.
    setInterval(loadPendingApprovals, 5000);
  }

  // ---- Action dispatch (event delegation - board re-renders wholesale) ----

  document.getElementById("container").addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    e.stopPropagation();
    var action = el.getAttribute("data-action");

    if (action === "add-thread") {
      var name = prompt("New thread name:");
      if (name) {
        var dateOpened = prompt("Date opened (e.g. 2026-08-02, optional):") || "";
        setSyncing(true);
        google.script.run.withSuccessHandler(loadBoard).addThread(name, dateOpened);
      }
    } else if (action === "toggle-thread") {
      var threadEl = el.closest(".thread");
      var willOpen = !threadEl.classList.contains("open");
      threadEl.classList.toggle("open");
      google.script.run.setThreadCollapsed(el.getAttribute("data-thread-id"), !willOpen);
    } else if (action === "rename-thread") {
      var tid = el.getAttribute("data-thread-id");
      var nameEl2 = el.querySelector(".thread-title");
      var dateEl2 = el.querySelector(".thread-date");
      var newName = prompt("Rename thread:", nameEl2 ? nameEl2.textContent : "");
      if (newName) {
        var newDate = prompt("Date opened (blank to clear):", dateEl2 ? dateEl2.textContent.replace(/^Opened /, "") : "") || "";
        setSyncing(true);
        google.script.run.withSuccessHandler(loadBoard).renameThread(tid, newName, newDate);
      }
    } else if (action === "toggle-color-picker") {
      var popover = document.querySelector('[data-color-popover="' + el.getAttribute("data-thread-id") + '"]');
      var wasOpen = popover && popover.classList.contains("open");
      document.querySelectorAll(".color-popover.open").forEach(function (p) { p.classList.remove("open"); });
      if (popover && !wasOpen) popover.classList.add("open");
    } else if (action === "set-thread-color") {
      var colorThreadId = el.getAttribute("data-thread-id");
      var color = el.getAttribute("data-color");
      document.querySelectorAll(".color-popover.open").forEach(function (p) { p.classList.remove("open"); });
      setSyncing(true);
      google.script.run.withSuccessHandler(loadBoard).setThreadColor(colorThreadId, color);
    } else if (action === "delete-thread") {
      var tid2 = el.getAttribute("data-thread-id");
      if (confirm("Delete this thread and everything in it?")) {
        setSyncing(true);
        google.script.run.withSuccessHandler(loadBoard).deleteThread(tid2);
      }
    } else if (action === "add-subthread") {
      var threadId = el.getAttribute("data-thread-id");
      var subName = prompt("New sub-thread name:");
      if (subName) {
        var tag = prompt("Optional tag (e.g. REFERRAL):") || "";
        var subDate = prompt("Date opened (optional):") || "";
        setSyncing(true);
        google.script.run.withSuccessHandler(loadBoard).addSubThread(threadId, subName, tag, subDate);
      }
    } else if (action === "toggle-subthread") {
      var subEl = el.closest(".subthread");
      var willOpenSub = !subEl.classList.contains("open");
      subEl.classList.toggle("open");
      google.script.run.setSubThreadCollapsed(el.getAttribute("data-subthread-id"), !willOpenSub);
    } else if (action === "rename-subthread") {
      var sid = el.getAttribute("data-subthread-id");
      var nameEl = el.querySelector(".subthread-name");
      var tagEl = el.querySelector(".subthread-tag");
      var subDateEl = el.querySelector(".subthread-date");
      var newSubName = prompt("Rename sub-thread:", nameEl ? nameEl.textContent : "");
      if (newSubName) {
        var newTag = prompt("Tag (leave blank to clear):", tagEl ? tagEl.textContent : "") || "";
        var newSubDate = prompt("Date opened (blank to clear):", subDateEl ? subDateEl.textContent.replace(/^Opened /, "") : "") || "";
        setSyncing(true);
        google.script.run.withSuccessHandler(loadBoard).renameSubThread(sid, newSubName, newTag, newSubDate);
      }
    } else if (action === "delete-subthread") {
      var sid2 = el.getAttribute("data-subthread-id");
      if (confirm("Delete this sub-thread and its steps?")) {
        setSyncing(true);
        google.script.run.withSuccessHandler(loadBoard).deleteSubThread(sid2, false);
      }
    } else if (action === "add-item") {
      var subId = el.getAttribute("data-subthread-id");
      var text = prompt("New step:");
      if (text) {
        var owner = prompt("Waiting on / owner (optional):") || "";
        var openDate = prompt("Opening date (YYYY-MM-DD, optional):") || "";
        var closeDate = prompt("Closing date (same as opening = still open/WIP; change once it's actually closed):", openDate) || "";
        setSyncing(true);
        google.script.run.withSuccessHandler(loadBoard).addItem(subId, text, owner, openDate, closeDate);
      }
    } else if (action === "toggle-item") {
      var itemId = el.getAttribute("data-item-id");
      el.classList.toggle("checked");
      el.textContent = el.classList.contains("checked") ? "✓" : "";
      var textEl = el.parentElement.querySelector(".action-text");
      if (textEl) textEl.classList.toggle("checked");
      google.script.run.withFailureHandler(function (err) { console.error(err); loadBoard(); }).toggleItem(itemId);
    } else if (action === "edit-item") {
      var iid = el.getAttribute("data-item-id");
      var itemEl = el.closest(".action-item");
      var ownerEl = el.parentElement.querySelector(".action-owner");
      var newText = prompt("Edit step:", el.textContent);
      if (newText !== null) {
        var newOwner = prompt("Waiting on / owner (blank to clear):", ownerEl ? ownerEl.textContent : "") || "";
        var newOpenDate = prompt("Opening date (blank to clear):", itemEl ? itemEl.getAttribute("data-open-date") : "") || "";
        var newCloseDate = prompt("Closing date (blank to clear):", itemEl ? itemEl.getAttribute("data-close-date") : "") || "";
        setSyncing(true);
        google.script.run.withSuccessHandler(loadBoard).editItem(iid, newText, newOwner, newOpenDate, newCloseDate);
      }
    } else if (action === "delete-item") {
      var iid2 = el.getAttribute("data-item-id");
      if (confirm("Delete this step?")) {
        setSyncing(true);
        google.script.run.withSuccessHandler(loadBoard).deleteItem(iid2);
      }
    }
  });

  // Close any open thread-color popover when clicking outside it.
  document.addEventListener("click", function (e) {
    if (e.target.closest(".thread-color-wrap")) return;
    document.querySelectorAll(".color-popover.open").forEach(function (p) { p.classList.remove("open"); });
  });

  // ---- Thread / sub-thread drag-and-drop reordering ----

  var draggedThreadId = null;
  var draggedSubThreadId = null;
  var draggedSubThreadParentId = null;
  var boardEl = document.getElementById("container");

  boardEl.addEventListener("dragstart", function (e) {
    var subHeaderEl = e.target.closest(".subthread-header");
    if (subHeaderEl) {
      var subEl = subHeaderEl.closest(".subthread");
      var parentThreadEl = subHeaderEl.closest(".thread");
      draggedSubThreadId = subEl.getAttribute("data-subthread-id");
      draggedSubThreadParentId = parentThreadEl ? parentThreadEl.getAttribute("data-thread-id") : null;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", draggedSubThreadId);
      subEl.classList.add("dragging");
      e.stopPropagation();
      return;
    }
    var threadHeaderEl = e.target.closest(".thread-header");
    if (!threadHeaderEl) return;
    var threadEl = threadHeaderEl.closest(".thread");
    draggedThreadId = threadEl.getAttribute("data-thread-id");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", draggedThreadId);
    threadEl.classList.add("dragging");
  });

  boardEl.addEventListener("dragend", function (e) {
    var threadEl = e.target.closest(".thread");
    if (threadEl) threadEl.classList.remove("dragging");
    var subEl = e.target.closest(".subthread");
    if (subEl) subEl.classList.remove("dragging");
    document.querySelectorAll(".thread.drag-over").forEach(function (el2) { el2.classList.remove("drag-over"); });
    document.querySelectorAll(".subthread.sub-drag-over").forEach(function (el2) { el2.classList.remove("sub-drag-over"); });
    draggedThreadId = null;
    draggedSubThreadId = null;
    draggedSubThreadParentId = null;
  });

  boardEl.addEventListener("dragover", function (e) {
    if (draggedSubThreadId) {
      var subTarget = e.target.closest(".subthread");
      if (!subTarget) return;
      var subTargetParent = subTarget.closest(".thread");
      if (!subTargetParent || subTargetParent.getAttribute("data-thread-id") !== draggedSubThreadParentId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      if (subTarget.getAttribute("data-subthread-id") !== draggedSubThreadId) {
        subTarget.classList.add("sub-drag-over");
      }
      e.stopPropagation();
      return;
    }
    var threadEl = e.target.closest(".thread");
    if (!threadEl || !draggedThreadId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    if (threadEl.getAttribute("data-thread-id") !== draggedThreadId) {
      threadEl.classList.add("drag-over");
    }
  });

  boardEl.addEventListener("dragleave", function (e) {
    if (draggedSubThreadId) {
      var subTarget = e.target.closest(".subthread");
      if (subTarget) subTarget.classList.remove("sub-drag-over");
      return;
    }
    var threadEl = e.target.closest(".thread");
    if (threadEl) threadEl.classList.remove("drag-over");
  });

  boardEl.addEventListener("drop", function (e) {
    if (draggedSubThreadId) {
      var subTargetEl = e.target.closest(".subthread");
      document.querySelectorAll(".subthread.sub-drag-over").forEach(function (el2) { el2.classList.remove("sub-drag-over"); });
      var fromSubId = draggedSubThreadId, fromParentId = draggedSubThreadParentId;
      draggedSubThreadId = null;
      draggedSubThreadParentId = null;
      if (!subTargetEl) return;
      e.preventDefault();
      var targetSubId = subTargetEl.getAttribute("data-subthread-id");
      var targetParentEl = subTargetEl.closest(".thread");
      if (!targetParentEl || targetParentEl.getAttribute("data-thread-id") !== fromParentId) return;
      if (targetSubId === fromSubId) return;

      var thread = (boardData.board || []).filter(function (t) { return t.threadId === fromParentId; })[0];
      if (!thread) return;
      var subIds = thread.subthreads.map(function (s) { return s.subThreadId; });
      var fromIdx = subIds.indexOf(fromSubId);
      if (fromIdx === -1) return;

      var subRect = subTargetEl.getBoundingClientRect();
      var insertSubAfter = (e.clientX - subRect.left) > subRect.width / 2;

      subIds.splice(fromIdx, 1);
      var toSubIdx = subIds.indexOf(targetSubId);
      subIds.splice(insertSubAfter ? toSubIdx + 1 : toSubIdx, 0, fromSubId);

      setSyncing(true);
      google.script.run
        .withSuccessHandler(loadBoard)
        .withFailureHandler(function (err) { console.error(err); loadBoard(); })
        .reorderSubThreads(subIds);
      return;
    }

    var targetEl = e.target.closest(".thread");
    document.querySelectorAll(".thread.drag-over").forEach(function (el2) { el2.classList.remove("drag-over"); });
    if (!targetEl || !draggedThreadId) return;
    e.preventDefault();
    var targetId = targetEl.getAttribute("data-thread-id");
    if (targetId === draggedThreadId) return;

    var ids = (boardData.board || []).map(function (t) { return t.threadId; });
    var fromIdx = ids.indexOf(draggedThreadId);
    if (fromIdx === -1) return;

    var rect = targetEl.getBoundingClientRect();
    var insertAfter = (e.clientY - rect.top) > rect.height / 2;

    ids.splice(fromIdx, 1);
    var toIdx = ids.indexOf(targetId);
    ids.splice(insertAfter ? toIdx + 1 : toIdx, 0, draggedThreadId);

    setSyncing(true);
    google.script.run
      .withSuccessHandler(loadBoard)
      .withFailureHandler(function (err) { console.error(err); loadBoard(); })
      .reorderThreads(ids);
  });

  loadBoard();
  loadPendingApprovals();
  startPolling();
</script>

</body>
</html>
